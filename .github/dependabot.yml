version: 2
updates:
  # Maintenance mode: npm gets security updates only.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A limit of 0 turns off routine version-update PRs. Security-update PRs
    # have their own fixed limit (10) that this setting does not affect, so
    # Dependabot security updates (enabled in the repository settings) still
    # open.
    open-pull-requests-limit: 0
    # Security fixes arrive as one PR instead of one per advisory. Dependabot
    # cannot regenerate THIRD_PARTY_NOTICES.md, so run `pnpm notices` on that
    # branch and commit the result (see docs/releasing.md).
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Major upgrades (for example SvelteKit 3) are deliberate migrations, never
    # automatic.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Stay on the Node 22 LTS line; major runtime moves are deliberate upgrades.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR for all actions keeps github/codeql-action init and analyze in
    # lockstep; the action refuses mismatched versions. Action majors are not
    # ignored.
    groups:
      github-actions:
        patterns:
          - "*"
