name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm notices:check

      - run: pnpm check

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-artifacts
          path: test-results/playwright
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify sensitive files cannot enter the Docker build context
        run: |
          mkdir -p apps/server apps/web
          printf 'VITE_UNKEEP_DOCKERIGNORE_PROBE=must-not-enter-build\n' > apps/web/.env.local
          printf '{}\n' > apps/web/unkeep-recovery-kit-context-probe.json
          printf '{}\n' > apps/web/unkeep-vault-context-probe.json
          printf 'probe\n' > apps/server/context-probe.sqlite
          printf 'probe\n' > apps/server/context-probe.sqlite-wal
          printf 'probe\n' > apps/server/context-probe.sqlite-shm
          docker build --platform linux/amd64 --target build --tag unkeep:context-probe .
          docker run --rm --entrypoint sh unkeep:context-probe -c \
            'test ! -e /app/apps/web/.env.local &&
             test ! -e /app/apps/web/unkeep-recovery-kit-context-probe.json &&
             test ! -e /app/apps/web/unkeep-vault-context-probe.json &&
             test ! -e /app/apps/server/context-probe.sqlite &&
             test ! -e /app/apps/server/context-probe.sqlite-wal &&
             test ! -e /app/apps/server/context-probe.sqlite-shm'

      - run: docker build --platform linux/amd64 --tag unkeep:test .

      - name: Exercise container
        run: bash scripts/container-smoke.sh unkeep:test

      - name: Fail on high or critical container vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker save --output "$RUNNER_TEMP/unkeep-image.tar" unkeep:test
          docker run --rm \
            --mount "type=bind,src=$RUNNER_TEMP/unkeep-image.tar,dst=/scan/unkeep.tar,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/trivy-cache,dst=/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --input /scan/unkeep.tar \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --scanners vuln \
              --no-progress \
              --skip-version-check
