name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: false
        default: main
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brettkinny/unkeep
  PNPM_VERSION: 10.33.4
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  validate:
    name: Validate amd64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Determine candidate identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          publish=false
          version="candidate-${release_sha:0:12}"

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::Release tags must look like v0.2.0 or v0.2.0-rc.1"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            git merge-base --is-ancestor "$release_sha" origin/main || {
              echo "::error::Release tags must point to a commit contained in main"
              exit 1
            }
            publish=true
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm notices:check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

      - name: Run browser tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: release-playwright-artifacts
          path: test-results/playwright
          retention-days: 7

      - name: Build amd64 candidate
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "UNKEEP_VERSION=${{ steps.release.outputs.version }}" \
            --build-arg "UNKEEP_REVISION=${{ steps.release.outputs.release_sha }}" \
            --tag unkeep:release-candidate \
            .

      - name: Exercise candidate container
        env:
          EXPECTED_REVISION: ${{ steps.release.outputs.release_sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/container-smoke.sh unkeep:release-candidate

      - name: Fail on high or critical container vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker save --output "$RUNNER_TEMP/unkeep-image.tar" unkeep:release-candidate
          docker run --rm \
            --mount "type=bind,src=$RUNNER_TEMP/unkeep-image.tar,dst=/scan/unkeep.tar,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/trivy-cache,dst=/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --input /scan/unkeep.tar \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --scanners vuln \
              --no-progress \
              --skip-version-check

  publish:
    name: Publish container and GitHub release
    if: needs.validate.outputs.publish == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          build-args: |
            UNKEEP_VERSION=${{ env.VERSION }}
            UNKEEP_REVISION=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Create release assets
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp compose.release.yaml THIRD_PARTY_NOTICES.md release-assets/
          {
            echo "image=$IMAGE@$IMAGE_DIGEST"
            echo "digest=$IMAGE_DIGEST"
            echo "architecture=linux/amd64"
            echo "revision=$RELEASE_SHA"
          } > "release-assets/unkeep-$VERSION-image-digest.txt"
          cd release-assets
          sha256sum \
            compose.release.yaml \
            THIRD_PARTY_NOTICES.md \
            "unkeep-$VERSION-image-digest.txt" > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --generate-notes \
              --title "UnKeep $VERSION" \
              "${prerelease[@]}" \
              --verify-tag
          fi

      - if: always()
        run: docker logout ghcr.io
